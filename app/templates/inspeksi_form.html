{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Form Inspeksi Kapal</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data" action="{{ url_for('main.submit_inspeksi') }}">
                    
                    <h5 class="mb-3 border-bottom pb-2">1. Data Kapal</h5>
                    <div class="mb-3">
                        <label class="form-label">Nama Kapal</label>
                        <input type="text" class="form-control" name="nama_kapal" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pemilik</label>
                        <input type="text" class="form-control" name="pemilik" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nomor Registrasi</label>
                        <input type="text" class="form-control" name="nomor_registrasi" required>
                    </div>

                    <h5 class="mb-3 mt-4 border-bottom pb-2">2. Kondisi Lambung (Upload Foto)</h5>
                    <div class="mb-3">
                        <label class="form-label">Foto Lambung Kapal</label>
                        <input type="file" class="form-control" name="foto_lambung" accept="image/*" required>
                        <div class="form-text">Gambar akan diproses menggunakan Machine Learning (HOG + SVM).</div>
                    </div>

                    <h5 class="mb-3 mt-4 border-bottom pb-2">3. Kelengkapan Administrasi (Checklist)</h5>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="apar" value="1" id="checkApar">
                        <label class="form-check-label" for="checkApar">Alat Pemadam Api Ringan (APAR)</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="radio" value="1" id="checkRadio">
                        <label class="form-check-label" for="checkRadio">Radio Komunikasi</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="jaket" value="1" id="checkJaket">
                        <label class="form-check-label" for="checkJaket">Jaket Pelampung</label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="mesin" value="1" id="checkMesin">
                        <label class="form-check-label" for="checkMesin">Kondisi Mesin Baik</label>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Proses Inspeksi & ML Prediksi</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
